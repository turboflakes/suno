[package]
name = "snops-common"
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description.workspace = true
edition.workspace = true


[dependencies]
lazy_static = "1.5"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
subxt = { version = "0.39.0", features = ["reconnecting-rpc-client"] }
subxt-core = { version = "0.39.0" }
subxt-signer = { version = "0.39.0", features = ["subxt"] }
thiserror = "2.0"
tokio = { version = "1.40.0", features = ["full"] }
tui-logger = "0.17"

[dev-dependencies]
tempfile = "3.2"
