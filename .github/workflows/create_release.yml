name: Rust CI - Create Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-self-hosted:
    name: Build on self-hosted (ubuntu-latest)
    runs-on: self-hosted
    steps:
      - name: Install system dependencies # required since `nokhwa` uses `v4l2` syscalls
        run: |
          sudo apt update
          sudo apt install -y clang \
            libclang-dev libv4l-dev libudev-dev \
            pkg-config

      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Run check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --target x86_64-unknown-linux-gnu -- -D warnings

      - name: Run cargo test --locked
        run: |
          cargo test --locked --all-features --all-targets --target x86_64-unknown-linux-gnu

      - name: Run cargo build
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package binary
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          tar -czvf suno-x86_64-unknown-linux-gnu.tar.gz suno
          sha256sum suno-x86_64-unknown-linux-gnu.tar.gz > suno-x86_64-unknown-linux-gnu.tar.gz.sha256

      - name: Upload suno tarball
        uses: actions/upload-artifact@v4
        with:
          name: suno-x86_64-unknown-linux-gnu.tar.gz
          path: target/x86_64-unknown-linux-gnu/release/suno-x86_64-unknown-linux-gnu.tar.gz

      - name: Upload suno tarball sha256
        uses: actions/upload-artifact@v4
        with:
          name: suno-x86_64-unknown-linux-gnu.tar.gz.sha256
          path: target/x86_64-unknown-linux-gnu/release/suno-x86_64-unknown-linux-gnu.tar.gz.sha256

  build-macos-aarch64:
    name: Build on macOS (aarch64-apple-darwin)
    runs-on: macos-latest # GitHub-hosted; use macos-14 for guaranteed Apple Silicon
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # NOTE: The following steps are commented out as they are run also on the self-hosted build
      #
      # - name: Run check formatting
      #   run: cargo fmt --all -- --check

      # - name: Run clippy
      #   run: cargo clippy --all-targets --target aarch64-apple-darwin -- -D warnings

      # - name: Run cargo test --locked
      #   run: |
      #     cargo test --locked --all-features --all-targets --target aarch64-apple-darwin

      - name: Run cargo build
        run: cargo build --release --target aarch64-apple-darwin

      - name: Package binary
        run: |
          cd target/aarch64-apple-darwin/release
          tar -czvf suno-aarch64-apple-darwin.tar.gz suno
          shasum -a 256 suno-aarch64-apple-darwin.tar.gz > suno-aarch64-apple-darwin.tar.gz.sha256

      - name: Upload suno tarball
        uses: actions/upload-artifact@v4
        with:
          name: suno-aarch64-apple-darwin.tar.gz
          path: target/aarch64-apple-darwin/release/suno-aarch64-apple-darwin.tar.gz

      - name: Upload suno tarball sha256
        uses: actions/upload-artifact@v4
        with:
          name: suno-aarch64-apple-darwin.tar.gz.sha256
          path: target/aarch64-apple-darwin/release/suno-aarch64-apple-darwin.tar.gz.sha256

  create-release:
    needs:
      - build-self-hosted
      - build-macos-aarch64
    runs-on: self-hosted
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Get Rustc version
        id: get_rustc
        run: echo "rustc=$(rustc -V)" >> $GITHUB_OUTPUT

      - name: Get Tag version
        id: get_tag
        run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          release_name: suno ${{ steps.get_tag.outputs.tag }}
          body: "Note: This release was built using `${{ steps.get_rustc.outputs.rustc }}`"
          draft: true
          prerelease: false

      # --- Linux tarball ---
      - name: Download suno tarball (linux)
        uses: actions/download-artifact@v4
        with:
          name: suno-x86_64-unknown-linux-gnu.tar.gz
          path: artifacts/linux

      - name: Download suno tarball sha256 (linux)
        uses: actions/download-artifact@v4
        with:
          name: suno-x86_64-unknown-linux-gnu.tar.gz.sha256
          path: artifacts/linux

      - name: Upload suno tarball (linux)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/linux/suno-x86_64-unknown-linux-gnu.tar.gz
          asset_name: suno-x86_64-unknown-linux-gnu.tar.gz
          asset_content_type: application/octet-stream

      - name: Upload suno tarball sha256 (linux)
        uses: actions/upload-release-asset@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/linux/suno-x86_64-unknown-linux-gnu.tar.gz.sha256
          asset_name: suno-x86_64-unknown-linux-gnu.tar.gz.sha256
          asset_content_type: text/plain

      # --- macOS aarch64 tarball ---
      - name: Download suno tarball (macos aarch64)
        uses: actions/download-artifact@v4
        with:
          name: suno-aarch64-apple-darwin.tar.gz
          path: artifacts/macos

      - name: Download suno tarball sha256 (macos aarch64)
        uses: actions/download-artifact@v4
        with:
          name: suno-aarch64-apple-darwin.tar.gz.sha256
          path: artifacts/macos

      - name: Upload suno tarball (macos aarch64)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/macos/suno-aarch64-apple-darwin.tar.gz
          asset_name: suno-aarch64-apple-darwin.tar.gz
          asset_content_type: application/octet-stream

      - name: Upload suno tarball sha256 (macos aarch64)
        uses: actions/upload-release-asset@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/macos/suno-aarch64-apple-darwin.tar.gz.sha256
          asset_name: suno-aarch64-apple-darwin.tar.gz.sha256
          asset_content_type: text/plain
