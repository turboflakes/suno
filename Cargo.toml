[workspace]
members = [
    "packages/actions",
    "packages/config",
    "packages/error",
    "packages/qrcode",
    "packages/primitives",
    "packages/signer",
    "packages/suno",
    "packages/theme",
    "packages/tui",
    "packages/chains/asset-hub-paseo",
    "packages/chains/asset-hub-polkadot",
    "packages/chains/asset-hub-kusama",
    "packages/chains/asset-hub-westend",
    "packages/chains/paseo",
    "packages/chains/polkadot",
    "packages/chains/kusama",
    "packages/chains/westend",
    "packages/chains/people-paseo",
    "packages/chains/people-polkadot",
    "packages/chains/people-kusama",
    "packages/chains/people-westend",
]

resolver = "2"

[workspace.package]
version = "0.5.0"
authors = ["paulo <paulo@turboflakes.io>"]
license = "Apache-2.0"
repository = "https://github.com/turboflakes/suno"
description = "Yet another way to manage Substrate Node Operations from your terminal."
edition = "2021"

[workspace.dependencies]
arboard = "3.6.1"
async-recursion = "1.0"
async-trait = "0.1.89"
clap = "4.6.0"
color-eyre = "0.6.3"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.31"
hex = "0.4"
image = "0.25"
indoc = "2"
lazy_static = "1.5"
log = "0.4"
nokhwa = { version = "0.10", features = ["input-native"] }
openssh = { version = "0.11", features = ["native-mux"] }
qrcodegen = "1.8"
ratatui = "0.29.0"
ratatui-image  = { version = "9", default-features = false, features = ["image-defaults", "crossterm"] }
regex = "1.11"
rxing = "0.5"
scale-encode = "0.10.1"
scale-info = "2.11.6"
secrecy = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.68"
serde_yaml = "0.9"
shellexpand = "3.1.2"
sp-arithmetic = "28.0.1"
sp-core = "39.0.0"
strum = { version = "0.26.3", features = ["derive"] }
subxt = { version = "0.50.2", features = ["reconnecting-rpc-client"] }
subxt-signer = { version = "0.50.2", features = ["polkadot-js-compat"] }
subxt-rpcs = { version = "0.50.2" }
tempfile = "3.2"
thiserror = "2.0"
tokio = { version = "1.43.0", features = ["full"] }
toml = "1.0.7"
tui-logger = "0.14"
unicode-width = "0.2.0"
zeroize = { version = "1.7", features = ["derive"] }

[profile.dev]
panic = "abort"
opt-level = 0
debug = true
[profile.dev.package."*"] # Keep LIBRARIES optimized
opt-level = 3

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "z"
incremental = true
