[workspace]
members = [
    "packages/actions",
    "packages/config",
    "packages/error",
    "packages/primitives",
    "packages/signer",
    "packages/suno",
    "packages/tui",
    "packages/chains/asset-hub-paseo",
    "packages/chains/asset-hub-polkadot",
    "packages/chains/asset-hub-kusama",
    "packages/chains/asset-hub-westend",
    "packages/chains/paseo",
    "packages/chains/polkadot",
    "packages/chains/kusama",
    "packages/chains/westend",
    "packages/chains/people-paseo",
    "packages/chains/people-polkadot",
    "packages/chains/people-kusama",
    "packages/chains/people-westend",
]

resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["paulo <paulo@turboflakes.io>"]
license = "MIT or Apache-2.0"
repository = "https://github.com/turboflakes/suno"
description = "Just another way of managing Substrate node operations in the Polkadot ecosystem."
edition = "2021"

[workspace.dependencies]
async-recursion = "1.0"
async-trait = "0.1.89"
color-eyre = "0.6.3"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.31"
indoc = "2"
lazy_static = "1.5"
log = "0.4"
ratatui = "0.29.0"
regex = "1.11"
secrecy = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.68"
serde_yaml = "0.9"
sp-arithmetic = "28.0.0"
strum = { version = "0.26.3", features = ["derive"] }
# subxt = { version = "0.44.2", features = ["reconnecting-rpc-client"] }
# subxt-signer = { version = "0.44.2", features = ["subxt", "polkadot-js-compat"] }
# subxt-rpcs = { version = "0.44.2", features = ["subxt"] }
# subxt = { git = "https://github.com/paritytech/subxt", features = ["reconnecting-rpc-client"] }
# subxt-signer = { git = "https://github.com/paritytech/subxt", package = "subxt-signer", features = ["subxt", "polkadot-js-compat"] }
# subxt-rpcs = { git = "https://github.com/paritytech/subxt", package = "subxt-rpcs", features = ["subxt"] }
subxt = { git = "https://github.com/turboflakes/subxt", branch = "fix-storage-fetch", features = ["reconnecting-rpc-client"] }
subxt-signer = { git = "https://github.com/turboflakes/subxt", package = "subxt-signer", branch = "fix-storage-fetch", features = ["subxt", "polkadot-js-compat"] }
subxt-rpcs = { git = "https://github.com/turboflakes/subxt", package = "subxt-rpcs",branch = "fix-storage-fetch", features = ["subxt"] }
tempfile = "3.2"
thiserror = "2.0"
tokio = { version = "1.43.0", features = ["full"] }
tui-logger = "0.14"
zeroize = { version = "1.7", features = ["derive"] }
