[workspace]
members = [
    "packages/actions",
    "packages/config",
    "packages/primitives",
    "packages/signer",
    "packages/suno",
    "packages/tui",
    "packages/chains/asset-hub-paseo",
    "packages/chains/paseo",
    "packages/chains/people-paseo",
]

resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["paulo <paulo@turboflakes.io>"]
license = "MIT or Apache-2.0"
repository = "https://github.com/turboflakes/suno"
description = "Just another way of managing Substrate node operations in the Polkadot ecosystem."
edition = "2021"

[workspace.dependencies]
async-recursion = "1.0"
color-eyre = "0.6.3"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.31"
indoc = "2"
lazy_static = "1.5"
log = "0.4"
ratatui = "0.29.0"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.68"
serde_yaml = "0.9"
strum = { version = "0.26.3", features = ["derive"] }
subxt = { version = "0.43.0", features = ["reconnecting-rpc-client"] }
subxt-core = { version = "0.43.0" }
subxt-signer = { version = "0.43.0", features = ["subxt"] }
subxt-rpcs = { version = "0.43.0", features = ["subxt"] }
tempfile = "3.2"
thiserror = "2.0"
tokio = { version = "1.43.0", features = ["full"] }
tui-logger = "0.14"
